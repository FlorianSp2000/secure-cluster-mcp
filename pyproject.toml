[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-cluster-mcp"
version = "0.2.0"
description = "MCP server for SLURM cluster interactions enabling end-to-end AI-assisted coding workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Florian Sp" }
]
keywords = ["mcp", "hpc", "cluster", "slurm", "ssh", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Clustering",
]
dependencies = [
    "fastmcp>=0.4.0",
    "paramiko>=3.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/FlorianSp2000/secure-cluster-mcp"
Repository = "https://github.com/FlorianSp2000/secure-cluster-mcp"
Issues = "https://github.com/FlorianSp2000/secure-cluster-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
secure-cluster-mcp = "secure_cluster_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_cluster_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
